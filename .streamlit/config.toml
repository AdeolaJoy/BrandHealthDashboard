[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false

[theme]
baseRadius = "0.6rem"
font = "sans-serif"

[theme.light]
primaryColor = "#121417"
backgroundColor = "#F5F5F2"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#121417"
borderColor = "#E2E2DC"

[theme.dark]
primaryColor = "#F2F3F4"
backgroundColor = "#0E0F11"
secondaryBackgroundColor = "#16181B"
textColor = "#F2F3F4"
borderColor = "#2A2D32"
